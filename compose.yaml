services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: edoctorat_docker
      MYSQL_USER: edoctorat
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/edoctorat_docker
      DB_USER: edoctorat
      DB_PASSWORD: ${DB_PASSWORD}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: